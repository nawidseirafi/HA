title: Abfalltermine
views:
  - title: Abfall
    cards:
      - type: markdown
        title: Nächste Abfalltermine
        content: |
          Heute ist Freitag, 5. Mai 2026
          
          ## Diese Woche
          🟨 **Freitag, 8. Mai**
          - Gelber Sack
          - Bioabfall
          
          ## Nächste Woche
          ⬛ **Dienstag, 12. Mai**
          - Sperrabfall
          
          🟨 **Samstag, 16. Mai**
          - Restabfall 14-tägig
          - Bioabfall  
          - Metall- & E-Schrott

      - type: custom:button-card
        entity: sensor.next_abfall_appointment
        name: Nächster Termin
        icon: mdi:trash-can
        show_label: true
        label: |
          [[[
            return states['sensor.next_abfall_date'].state;
          ]]]
        color: var(--paper-item-icon-color)
        tap_action:
          action: toggle

      - type: entities
        title: Abfall Übersicht
        entities:
          - entity: sensor.next_abfall_appointment
          - entity: sensor.next_abfall_date
          - entity: sensor.next_abfall_category

      - type: custom:auto-entities
        card:
          type: entities
          title: Kommende Termine
        filter:
          include:
            - entity_id: sensor.abfall_*
