# Home Assistant Automation für Abfalltermine
# Kopiere diesen Block in deine automations.yaml

automation:
  - id: update_abfall_appointments
    alias: "Abfalltermine aktualisieren"
    description: "Aktualisiert die nächsten Abfalltermine täglich"
    trigger:
      - platform: time
        at: "06:00:00"
      - platform: homeassistant
        event: start
    action:
      - service: shell_command.update_abfall_widget
    mode: single

shell_command:
  update_abfall_widget: python3 /config/python_scripts/abfall_widget.py

# Template Sensoren für die Abfalltermine
template:
  - sensor:
      - name: "Nächster Abfalltermin"
        unique_id: next_abfall_appointment
        unit_of_measurement: ""
        state: >
          {% set abfall_dates = [
            {'title': 'Fr. 08.05. - Gelber Sack + Bioabfall', 'date': '2026-05-08'},
            {'title': 'Di. 12.05. - Sperrabfall', 'date': '2026-05-12'},
            {'title': 'Sa. 16.05. - Restabfall + Bioabfall + Metall', 'date': '2026-05-16'},
            {'title': 'Fr. 22.05. - Papier + Bioabfall', 'date': '2026-05-22'},
            {'title': 'Sa. 30.05. - Restabfall + Bioabfall + Metall', 'date': '2026-05-30'}
          ] %}
          {% set today = now() %}
          {% for item in abfall_dates %}
            {% if item.date >= today.strftime('%Y-%m-%d') %}
              {{ item.title }}
            {% endif %}
          {% endfor %}

      - name: "Abfalltermin Datum"
        unique_id: next_abfall_date
        unit_of_measurement: ""
        state: >
          {% set next_date = as_timestamp('2026-05-08') %}
          {% if next_date %}
            {{ (next_date | timestamp_custom('%d.%m.%Y')) }}
          {% else %}
            Keine Termine
          {% endif %}

      - name: "Abfalltermin Kategorie"
        unique_id: next_abfall_category
        unit_of_measurement: ""
        state: "Gelber Sack, Bioabfall"

# Alias Automatisierung für Benachrichtigungen
automation:
  - id: notify_abfall_appointment
    alias: "Abfalltermin Benachrichtigung"
    description: "Sendet eine Benachrichtigung vor jedem Abfalltermin"
    trigger:
      - platform: time
        at: "19:30:00"
    condition:
      - condition: template
        value_template: >
          {% set tomorrow_dates = ['08.05', '12.05', '16.05', '22.05', '30.05'] %}
          {% set tomorrow = (now() + timedelta(days=1)).strftime('%d.%m') %}
          {{ tomorrow in tomorrow_dates }}
    action:
      - service: notify.notify
        data:
          title: "Abfalltermin morgen!"
          message: >
            {% set tomorrow = (now() + timedelta(days=1)).strftime('%d.%m') %}
            {% if tomorrow == '08.05' %}
              Gelber Sack und Bioabfall
            {% elif tomorrow == '12.05' %}
              Sperrabfall
            {% elif tomorrow == '16.05' %}
              Restabfall, Bioabfall und Metall
            {% elif tomorrow == '22.05' %}
              Papier und Bioabfall
            {% elif tomorrow == '30.05' %}
              Restabfall, Bioabfall und Metall
            {% endif %}
    mode: single
