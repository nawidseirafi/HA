# =============================================================================
#  Home Assistant Wand-Dashboard für iPad (Querformat)
# -----------------------------------------------------------------------------
#  HACS-Voraussetzungen:
#    - mushroom, mushroom-themes
#    - mini-graph-card
#    - auto-entities
#    - layout-card
#    - card-mod
#  Entity-IDs an eigene Installation anpassen (Suchen/Ersetzen).
# =============================================================================

title: Zuhause
views:
  - title: Übersicht
    path: home
    icon: mdi:home-variant
    theme: Mushroom
    panel: true        # <-- volle Breite, keine Sections
    cards:

      # Ein einziger Container, der das gesamte Grid hält
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          # 12-Spalten-Raster, nutzt den ganzen Bildschirm
          grid-template-columns: repeat(12, 1fr)
          grid-gap: 14px
          grid-auto-flow: row dense
          margin: 0
          padding: 14px
          # iPad-Querformat: keine künstliche Breitenbegrenzung
          max-width: 100%
        cards:

          # ─────────────────────────────────────────────────────────
          # 1) Hero – Kopfzeile (volle Breite)
          # ─────────────────────────────────────────────────────────
          - type: custom:mushroom-template-card
            entity: weather.forecast_home
            primary: >
              {% set h = now().hour %}
              {% if h < 5 %}Gute Nacht, Nawid
              {% elif h < 11 %}Guten Morgen, Nawid
              {% elif h < 18 %}Guten Tag, Nawid
              {% else %}Guten Abend, Nawid{% endif %}
            secondary: >
              {{ now().strftime('%A, %d. %B %Y · %H:%M') }} ·
              {{ state_attr(entity, 'temperature') }} °C · {{ state_attr(entity,
              'humidity') }} % Luftfeuchte
              {{ states(entity) | replace('_',' ') | title }}
            icon: >
              {% set s = states('weather.forecast_home') %}
              {% if s == 'sunny' %}mdi:weather-sunny
              {% elif s == 'partlycloudy' %}mdi:weather-partly-cloudy
              {% elif s == 'cloudy' %}mdi:weather-cloudy
              {% elif s == 'rainy' %}mdi:weather-rainy
              {% elif s == 'pouring' %}mdi:weather-pouring
              {% elif s == 'snowy' %}mdi:weather-snowy
              {% elif s == 'fog' %}mdi:weather-fog
              {% else %}mdi:weather-partly-cloudy{% endif %}
            icon_color: amber
            fill_container: true
            multiline_secondary: true
            view_layout:
              grid-column: span 12
            card_mod:
              style: |
                ha-card {
                  background: linear-gradient(135deg,#1d2630 0%,#252f3b 100%) !important;
                  border-radius: 18px !important;
                  border: none !important;
                  padding: 10px 8px !important;
                }
                ha-card .primary { font-size: 24px !important; font-weight: 700 !important; }
                ha-card .secondary { color: #8b95a3 !important; font-size: 13px !important; }

          # ─────────────────────────────────────────────────────────
          # 2) Personen (6/12)
          # ─────────────────────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-column: span 6
            cards:
              - type: custom:mushroom-title-card
                title: Wer ist zuhause?
                subtitle: ""
              - type: custom:auto-entities
                card:
                  type: custom:mushroom-chips-card
                  alignment: start
                card_param: chips
                filter:
                  include:
                    - domain: person
                      options:
                        type: entity
                        icon_color: >
                          {{ 'green' if states(entity) == 'home' else 'grey' }}
                        content_info: name
                        use_entity_picture: true
                        tap_action:
                          action: more-info
                card_mod:
                  style: |
                    ha-card {
                      background: #1e242c !important;
                      border-radius: 18px !important;
                      border: none !important;
                      padding: 12px !important;
                    }

          # ─────────────────────────────────────────────────────────
          # 4) Stromverbrauch (6/12)
          # ─────────────────────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-column: span 6
            cards:
              - type: custom:mushroom-title-card
                title: Stromverbrauch
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: 1fr 1fr 1fr
                  grid-gap: 10px
                cards:
                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.power_consumption') }} W"
                    secondary: Aktuell
                    icon: mdi:flash
                    icon_color: amber
                    card_mod: &mini_tile
                      style: |
                        ha-card {
                          background: #242b34 !important;
                          border-radius: 12px !important;
                          border: none !important;
                          text-align: center;
                          padding: 8px !important;
                        }
                        ha-card .primary { font-size: 18px !important; font-weight: 700 !important; }
                        ha-card .secondary { font-size: 11px !important; }
                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.energy_today') }} kWh"
                    secondary: Heute
                    icon: mdi:counter
                    icon_color: orange
                    card_mod: *mini_tile
                  - type: custom:mushroom-template-card
                    primary: "{{ states('sensor.energy_month') }} kWh"
                    secondary: "{{ now().strftime('%B') }}"
                    icon: mdi:calendar-month
                    icon_color: deep-orange
                    card_mod: *mini_tile
              - type: custom:mini-graph-card
                entities:
                  - entity: sensor.power_consumption
                    name: Leistung
                    color: '#f39c12'
                hours_to_show: 24
                points_per_hour: 2
                line_width: 2
                smoothing: true
                height: 60
                show:
                  labels: false
                  extrema: false
                  name: false
                  icon: false
                  state: false
                  legend: false
                card_mod:
                  style: |
                    ha-card {
                      background: linear-gradient(180deg,rgba(243,156,18,.18) 0%,rgba(243,156,18,0) 100%) !important;
                      border-radius: 12px !important;
                      border: none !important;
                      box-shadow: none !important;
                      padding: 4px !important;
                      margin-top: 8px;
                    }

          # ─────────────────────────────────────────────────────────
          # 5) Licht & Beschattung (6/12)
          # ─────────────────────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-column: span 6
            cards:
              - type: custom:mushroom-title-card
                title: Licht & Beschattung
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: 1fr 1fr 1fr
                  grid-gap: 10px
                cards:
                  - type: custom:mushroom-template-card
                    primary: >
                      {{ states.light | selectattr('state','eq','on') | list | count }}
                      / {{ states.light | list | count }}
                    secondary: Lichter an
                    icon: mdi:lightbulb-on
                    icon_color: amber
                    fill_container: true
                    tap_action:
                      action: call-service
                      service: light.turn_off
                      target:
                        entity_id: all
                    card_mod: &inner_tile
                      style: |
                        ha-card {
                          background: #242b34 !important;
                          border-radius: 14px !important;
                          border: none !important;
                          padding: 10px !important;
                        }
                  - type: custom:mushroom-template-card
                    primary: >
                      {{ states.cover | rejectattr('state','eq','closed') | list | count }}
                      / {{ states.cover | list | count }}
                    secondary: Rollläden offen
                    icon: mdi:window-shutter-open
                    icon_color: blue
                    fill_container: true
                    card_mod: *inner_tile
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set windows = namespace(count=0) %}
                      {% for entity_id in states.binary_sensor %}
                        {% if state_attr(entity_id, 'device_class') == 'window' and states(entity_id) == 'on' %}
                          {% set windows.count = windows.count + 1 %}
                        {% endif %}
                      {% endfor %}
                      {{ windows.count }}
                    secondary: Fenster offen
                    icon: mdi:window-open-variant
                    icon_color: >
                      {% set windows = namespace(count=0) %}
                      {% for entity_id in states.binary_sensor %}
                        {% if state_attr(entity_id, 'device_class') == 'window' and states(entity_id) == 'on' %}
                          {% set windows.count = windows.count + 1 %}
                        {% endif %}
                      {% endfor %}
                      {{ 'red' if windows.count > 0 else 'disabled' }}
                    fill_container: true
                    card_mod: *inner_tile

          # ─────────────────────────────────────────────────────────
          # 6) Wetter (6/12)
          # ─────────────────────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-column: span 6
            cards:
              - type: custom:mushroom-title-card
                title: Wetter
              - type: weather-forecast
                entity: weather.forecast_home
                forecast_type: daily
                show_current: false
                show_forecast: true
                card_mod:
                  style: |
                    ha-card {
                      background: #1e242c !important;
                      border-radius: 18px !important;
                      border: none !important;
                      box-shadow: none !important;
                    }

          # ─────────────────────────────────────────────────────────
          # 7) Batterien (6/12)
          # ─────────────────────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-column: span 6
            cards:
              - type: custom:mushroom-title-card
                title: 🔋 Batterie Status
              - type: custom:auto-entities
                card_param: cards
                card:
                  type: grid
                  columns: 1
                  square: false
                filter:
                  include:
                    - entity_id: "*battery*"
                      options:
                        type: custom:mushroom-template-card
                        layout: horizontal
                        fill_container: true
                        primary: "{{ state_attr(entity, 'friendly_name') }}"
                        secondary: "Akkustand: {{ states(entity) }} %"
                        icon: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 10 %} mdi:battery-alert-variant-outline
                          {% elif b <= 25 %} mdi:battery-20
                          {% elif b <= 50 %} mdi:battery-50
                          {% elif b <= 75 %} mdi:battery-70
                          {% else %} mdi:battery-check
                          {% endif %}
                        icon_color: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 15 %} red
                          {% elif b <= 30 %} deep-orange
                          {% elif b <= 60 %} amber
                          {% else %} green
                          {% endif %}
                        tap_action:
                          action: more-info
                    - entity_id: "*batterie*"
                      options:
                        type: custom:mushroom-template-card
                        layout: horizontal
                        fill_container: true
                        primary: "{{ state_attr(entity, 'friendly_name') }}"
                        secondary: "Akkustand: {{ states(entity) }} %"
                        icon: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 10 %} mdi:battery-alert-variant-outline
                          {% elif b <= 25 %} mdi:battery-20
                          {% elif b <= 50 %} mdi:battery-50
                          {% elif b <= 75 %} mdi:battery-70
                          {% else %} mdi:battery-check
                          {% endif %}
                        icon_color: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 15 %} red
                          {% elif b <= 30 %} deep-orange
                          {% elif b <= 60 %} amber
                          {% else %} green
                          {% endif %}
                        tap_action:
                          action: more-info
                  exclude:
                    - state: unavailable
                    - state: unknown
                sort:
                  method: state
                  numeric: true
                  count: 1
              - type: custom:expander-card
                title: Weitere Batterien
                clear: true
                cards:
                  - type: custom:auto-entities
                    card_param: cards
                    card:
                      type: grid
                      columns: 1
                      square: false
                    filter:
                      include:
                        - entity_id: "*battery*"
                          options:
                            type: custom:mushroom-template-card
                            layout: horizontal
                            fill_container: true
                            primary: "{{ state_attr(entity, 'friendly_name') }}"
                            secondary: "Akkustand: {{ states(entity) }} %"
                            icon: |
                              {% set b = states(entity) | int(0) %}
                              {% if b <= 10 %} mdi:battery-alert-variant-outline
                              {% elif b <= 25 %} mdi:battery-20
                              {% elif b <= 50 %} mdi:battery-50
                              {% elif b <= 75 %} mdi:battery-70
                              {% else %} mdi:battery-check
                              {% endif %}
                            icon_color: |
                              {% set b = states(entity) | int(0) %}
                              {% if b <= 15 %} red
                              {% elif b <= 30 %} deep-orange
                              {% elif b <= 60 %} amber
                              {% else %} green
                              {% endif %}
                            tap_action:
                              action: more-info
                        - entity_id: "*batterie*"
                          options:
                            type: custom:mushroom-template-card
                            layout: horizontal
                            fill_container: true
                            primary: "{{ state_attr(entity, 'friendly_name') }}"
                            secondary: "Akkustand: {{ states(entity) }} %"
                            icon: |
                              {% set b = states(entity) | int(0) %}
                              {% if b <= 10 %} mdi:battery-alert-variant-outline
                              {% elif b <= 25 %} mdi:battery-20
                              {% elif b <= 50 %} mdi:battery-50
                              {% elif b <= 75 %} mdi:battery-70
                              {% else %} mdi:battery-check
                              {% endif %}
                            icon_color: |
                              {% set b = states(entity) | int(0) %}
                              {% if b <= 15 %} red
                              {% elif b <= 30 %} deep-orange
                              {% elif b <= 60 %} amber
                              {% else %} green
                              {% endif %}
                            tap_action:
                              action: more-info
                      exclude:
                        - state: unavailable
                        - state: unknown
                    sort:
                      method: state
                      numeric: true
                      first: 1


          # ─────────────────────────────────────────────────────────
          # 8) Status (volle Breite, 5 Kacheln)
          # ─────────────────────────────────────────────────────────
          - type: vertical-stack
            view_layout:
              grid-column: span 12
            cards:
              - type: custom:mushroom-title-card
                title: Status
              - type: custom:layout-card
                layout_type: custom:grid-layout
                layout:
                  grid-template-columns: repeat(5, 1fr)
                  grid-gap: 10px
                cards:
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set temps = namespace(values=[]) %}
                      {% set hums = namespace(values=[]) %}

                      {% for area in floor_areas('Basement') %}
                        {% for entity_id in area_entities(area) %}

                          {% set state = states(entity_id) %}

                          {% if state not in ['unknown', 'unavailable', 'none'] %}

                            {# Temperatur Sensoren #}
                            {% if state_attr(entity_id, 'device_class') == 'temperature' %}
                              {% set val = state | float(none) %}
                              {% if val is not none %}
                                {% set temps.values = temps.values + [val] %}
                              {% endif %}
                            {% endif %}

                            {# Luftfeuchtigkeit Sensoren #}
                            {% if state_attr(entity_id, 'device_class') == 'humidity' %}
                              {% set val = state | float(none) %}
                              {% if val is not none %}
                                {% set hums.values = hums.values + [val] %}
                              {% endif %}
                            {% endif %}

                            {# humidifier Temperatur #}
                            {% set h_temp = state_attr(entity_id, 'current_temperature') %}
                            {% if h_temp is not none %}
                              {% set temps.values = temps.values + [h_temp | float] %}
                            {% endif %}

                            {# humidifier Luftfeuchtigkeit #}
                            {% set h_hum = state_attr(entity_id, 'current_humidity') %}
                            {% if h_hum is not none %}
                              {% set hums.values = hums.values + [h_hum | float] %}
                            {% endif %}

                          {% endif %}

                        {% endfor %}
                      {% endfor %}

                      {% set avg_temp =
                        ((temps.values | sum) / (temps.values | length)) | round(1)
                        if temps.values | length > 0 else '--'
                      %}

                      {% set avg_hum =
                        ((hums.values | sum) / (hums.values | length)) | round(0)
                        if hums.values | length > 0 else '--'
                      %}

                      {{ avg_temp }} °C · {{ avg_hum }} %

                    secondary: Ø Keller
                    icon: mdi:home-floor-b
                    icon_color: teal
                    fill_container: true
                    card_mod: *inner_tile
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set temps = namespace(values=[]) %}
                      {% set hums = namespace(values=[]) %}

                      {% for floor in floors() %}
                        {% if floor != 'Basement' %}
                          {% for area in floor_areas(floor) %}
                            {% for entity_id in area_entities(area) %}

                              {% set state = states(entity_id) %}

                              {% if state not in ['unknown', 'unavailable', 'none'] %}

                                {% if state_attr(entity_id, 'device_class') == 'temperature' %}
                                  {% set val = state | float(none) %}
                                  {% if val is not none %}
                                    {% set temps.values = temps.values + [val] %}
                                  {% endif %}
                                {% endif %}

                                {% if state_attr(entity_id, 'device_class') == 'humidity' %}
                                  {% set val = state | float(none) %}
                                  {% if val is not none %}
                                    {% set hums.values = hums.values + [val] %}
                                  {% endif %}
                                {% endif %}

                                {% set h_temp = state_attr(entity_id, 'current_temperature') %}
                                {% if h_temp is not none %}
                                  {% set temps.values = temps.values + [h_temp | float] %}
                                {% endif %}

                                {% set h_hum = state_attr(entity_id, 'current_humidity') %}
                                {% if h_hum is not none %}
                                  {% set hums.values = hums.values + [h_hum | float] %}
                                {% endif %}

                              {% endif %}

                            {% endfor %}
                          {% endfor %}
                        {% endif %}
                      {% endfor %}

                      {% set avg_temp =
                        ((temps.values | sum) / (temps.values | length)) | round(1)
                        if temps.values | length > 0 else '--'
                      %}

                      {% set avg_hum =
                        ((hums.values | sum) / (hums.values | length)) | round(0)
                        if hums.values | length > 0 else '--'
                      %}

                      {{ avg_temp }} °C · {{ avg_hum }} %

                    secondary: Ø Haus ohne Keller
                    icon: mdi:home-thermometer-outline
                    icon_color: green
                    fill_container: true
                    card_mod: *inner_tile
                  - type: custom:mushroom-template-card
                    primary: >
                      {% set hums = namespace(values=[]) %}
                      {% for entity in states.sensor %}
                        {% set entity_id = entity.entity_id %}
                        {% set state = states(entity_id) %}
                        {% if state_attr(entity_id, 'device_class') == 'humidity'
                          and state not in ['unavailable', 'unknown', 'none'] %}
                          {% set val = state | float(none) %}
                          {% if val is not none %}
                            {% set hums.values = hums.values + [val] %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                      {% if hums.values | length > 0 %}
                        {{ ((hums.values | sum) / (hums.values | length)) | round(1) }} %
                      {% else %}
                        -- %
                      {% endif %}
                    secondary: Ø Luftfeuchtigkeit
                    icon: mdi:water-percent
                    icon_color: blue
                    fill_container: true
                    card_mod: *inner_tile
                  - type: custom:mushroom-template-card
                    entity: input_boolean.post_im_briefkasten
                    primary: |
                      {% if is_state(entity, 'on') %}
                        📬 Post ist da!
                      {% else %}
                        📭 Keine Post
                      {% endif %}
                    secondary: |
                      {% if is_state(entity, 'on') %}
                        Bitte Briefkasten leeren
                      {% else %}
                        Alles ruhig
                      {% endif %}
                    icon: |
                      {% if is_state(entity, 'on') %}
                        mdi:mailbox
                      {% else %}
                        mdi:mailbox-outline
                      {% endif %}
                    icon_color: |
                      {% if is_state(entity, 'on') %}
                        red
                      {% else %}
                        green
                      {% endif %}
                    fill_container: true
                    tap_action:
                      action: more-info
                    card_mod: *inner_tile
                  - type: custom:mushroom-template-card
                    entity: sensor.abfall_nachster_termin
                    primary: "{{ states('sensor.abfall_nachste_art') }}"
                    secondary: >-
                      {{ states('sensor.abfall_nachstes_datum') }} · in {{
                      states('sensor.abfall_tage_bis_abholung') }} Tagen
                    icon: mdi:trash-can
                    icon_color: green
                    fill_container: true
                    card_mod: *inner_tile
