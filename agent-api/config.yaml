server:
  host: 0.0.0.0
  port: 8080

logging:
  file: "./logs/agent-api.log"
  level: INFO

auth:
  username_env: AGENT_API_USERNAME
  password_env: AGENT_API_PASSWORD
  jwt_secret_env: AGENT_API_JWT_SECRET
  token_ttl_seconds: 604800
  away_reauth:
    enabled: true
    presence_entity: "person.nawid"
    home_states:
      - home
    cache_seconds: 10
    token_ttl_seconds: 43200
home_assistant:
  url: HA_URL
  token: HA_TOKEN

infrastructure:
  enabled: true
  database_path: data/infrastructure/infrastructure.db
  entities:
    internet_status: ""
    fritzbox_status: ""
    connected_devices: ""
    wifi_status: ""
    wan_status: ""
    upload_speed: ""
    download_speed: ""
    external_ip: ""
    uptime: ""

context:
  database_path: data/context/context.db
  departure_window_seconds: 300
  short_away_return_seconds: 600
  garage_open_after_away_seconds: 600
  long_away_seconds: 7200
  entities:
    person: "person.nawid"
    garage_door: "cover.garage_garegentor_garage"

household:
  notifications:
    notify_service: "notify.mobile_app_system_error_404"
    openings_push_enabled: true
  front_light:
    enabled: true
    control_enabled: true
    auto_discovery: true
    light_entity: ""
    light_entities:
      - "light.eingang"
      - "light.front_door"
    evening_start: "18:00"
    morning_end: "07:00"
    turn_off_after_minutes: 10
    min_confidence: 0.55
    arrival_states:
      - COMING_HOME
    arrival_garage_states:
      - READY_TO_OPEN
  garage:
    enabled: true
    control_enabled: true
    auto_discovery: true
    garage_entity: "cover.garage_garegentor_garage"
    allow_open: true
    allow_close: true
    min_confidence: 0.6
  shutters:
    enabled: true
    control_enabled: true
    auto_discovery: true
    ground_floor_entities: []
    open_after_sunrise: true
    fallback_open_after: "07:30"
    min_confidence: 0.6
    close_states:
      - SLEEPING
    block_house_states:
      - OUTSIDE
      - GUESTS
      - RELAXING
  comfort:
    bedroom_fan:
      enabled: true
      control_enabled: true
      ai_enabled: true
      auto_discovery: true
      person_entity: "person.nawid"
      temperature_entity: "sensor.bedroom_schlafzimmer_temperatur"
      fan_entity: "fan.bedroom_bedroom_ventilator"
      presence_entity: ""
      window_entity: ""
      turn_on_above_c: 24.5
      turn_off_below_c: 23.5
      sleep_start: "21:30"
      sleep_end: "07:30"
      min_runtime_minutes: 15

llm:
  provider: "openai"  # Options: gemini, openai, claude, llama
  gemini:
    api_key: GEMINI_API_KEY
    model: "gemini-2.5-flash"
  openai:
    api_key: OPENAI_API_KEY
    model: "gpt-4.1-mini"
  claude:
    api_key: CLAUDE_API_KEY
    model: "claude-3-5-sonnet"
  llama:
    base_url: "http://192.168.178.X:11434"
    model: "qwen2.5:3b"
