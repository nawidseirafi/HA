server:
  host: 0.0.0.0
  port: 8080

logging:
  file: "./logs/agent-api.log"
  level: INFO

auth:
  username_env: AGENT_API_USERNAME
  password_env: AGENT_API_PASSWORD
  jwt_secret_env: AGENT_API_JWT_SECRET
  token_ttl_seconds: 604800
home_assistant:
  url: HA_URL
  token: HA_TOKEN

infrastructure:
  enabled: true
  database_path: data/infrastructure/infrastructure.db
  entities:
    internet_status: ""
    fritzbox_status: ""
    connected_devices: ""
    wifi_status: ""
    wan_status: ""
    upload_speed: ""
    download_speed: ""
    external_ip: ""
    uptime: ""

household:
  comfort:
    bedroom_fan:
      enabled: true
      control_enabled: true
      ai_enabled: true
      auto_discovery: true
      person_entity: ""
      temperature_entity: ""
      fan_entity: ""
      presence_entity: ""
      window_entity: ""
      turn_on_above_c: 24.5
      turn_off_below_c: 23.5
      sleep_start: "21:30"
      sleep_end: "07:30"
      min_runtime_minutes: 15

llm:
  provider: "openai"  # Options: gemini, openai, claude, llama
  gemini:
    api_key: GEMINI_API_KEY
    model: "gemini-2.5-flash"
  openai:
    api_key: OPENAI_API_KEY
    model: "gpt-4.1-mini"
  claude:
    api_key: CLAUDE_API_KEY
    model: "claude-3-5-sonnet"
  llama:
    base_url: "http://192.168.178.X:11434"
    model: "qwen2.5:3b"
