server:
  host: 0.0.0.0
  port: 8080

storage:
  uploads_dir: ../ai-agent/data/invoices/inbox

logging:
  file: logs/agent-api.log
  level: INFO

auth:
  username_env: AGENT_API_USERNAME
  password_env: AGENT_API_PASSWORD
  jwt_secret_env: AGENT_API_JWT_SECRET
  token_ttl_seconds: 604800

agents:
  invoices:
    enabled: true
    upload_dir: ../ai-agent/data/invoices/inbox
    run_timeout_seconds: 1800
    schedule:
      - "22:00:00"
  vacation:
    enabled: true
  mywellness:
    enabled: true
    token_env: MY_WELLNESS_TOKEN
    user_id_env: MY_WELLNESS_USER_ID
    facility_id_env: MY_WELLNESS_FACILITY_ID
    desired_courses:
      - Cross-Power
      - Body Workout
      - Functional Training
    days: 2
    schedule:
      - "17:00:00"
      - "20:59:58"
  market:
    enabled: true
    database_path: ../ai-agent/data/market/market.db
    price_provider: yahoo
    news_provider: fallback
