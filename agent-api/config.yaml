server:
  host: 0.0.0.0
  port: 8080

logging:
  file: ../logs/agent-api.log
  level: INFO

auth:
  username_env: AGENT_API_USERNAME
  password_env: AGENT_API_PASSWORD
  jwt_secret_env: AGENT_API_JWT_SECRET
  token_ttl_seconds: 604800
home_assistant:
  url: HA_URL
  token: HA_TOKEN

llm:
  provider: "openai"  # Options: gemini, openai, claude, llama
  gemini:
    api_key: GEMINI_API_KEY
    model: "gemini-2.5-flash"
  openai:
    api_key: OPENAI_API_KEY
    model: "gpt-4.1-mini"
  claude:
    api_key: CLAUDE_API_KEY
    model: "claude-3-5-sonnet"
  llama:
    base_url: "http://192.168.178.X:11434"
    model: "qwen2.5:3b"

agents:
  invoices:
    enabled: true
    upload_dir: data/invoices/inbox
    run_timeout_seconds: 1800
    schedule:
      - "22:00:00"
    inbox_dir: "data/invoices/inbox"
    archive_dir: "data/invoices/archive"
    review_dir: "data/invoices/review"
    export_dir: "data/invoices/exports"
    database_path: "data/invoices/invoices.db"
    log_path: logs/invoices.log
    email_attachment_dir: "data/invoices/inbox"
    poll_interval_seconds: 600
    default_category: "Unsortiert"
    confidence_threshold: 0.5
    require_amount_for_archive: true
    reprocess_existing: false
    archive_cleanup:
      enabled: true
      apply: true
      backup_dir: "data/invoices/archive_cleanup_backup"
    ai_extraction:
      enabled: true
      always_for_documents: true
      min_confidence: 0.8
      max_file_bytes: 10485760
    email:
      enabled: true
      host_env: "INVOICE_EMAIL_HOST"
      port: 993
      username_env: "INVOICE_EMAIL_USERNAME"
      password_env: "INVOICE_EMAIL_PASSWORD"
      mailbox: "INBOX"
      search: "ALL"
      mark_seen: false
      max_messages: 500
      lookback_days: 7
      attachment_extensions:
        - ".pdf"
    portals:
      enabled: false
      providers:
        - name: "huk24"
          enabled: true
          url: "https://www.huk24.de/meine-huk24/postfach/"
          session_path: "data/invoices/portal_sessions/huk24.json"
          download_dir: "data/invoices/inbox"
          debug_dir: "data/invoices/portal_debug/huk24"
          headless: true
          wait_seconds: 45
    home_assistant_notifications:
      enabled: true
      only_on_changes: true
      title: "Rechnungs-Agent"
      notification_id: "invoice_agent"
      notify_service: "notify.mobile_app_system_error_404"
      persistent: true
    tax_export:
      output_dir: "data/invoices/tax"
      categories:
        all inkl: "Webhosting"
        all-inkl: "Webhosting"
        apotheke: "Gesundheit"
        auto: "KFZ"
        autoversicherung: "Versicherung"
        congstar: "Telekommunikation"
        elster: "Steuer"
        finanzamt: "Steuer"
        gebäudeversicherung: "Versicherung"
        grundbesitz: "Immobilie"
        hausrat: "Versicherung"
        hotel: "Reisekosten"
        huk24: "Versicherung"
        kfz: "KFZ"
        lkh: "Versicherung"
        restaurant: "Bewirtung"
        rechtschutz: "Versicherung"
        rechtsschutz: "Versicherung"
        sc technology: "Beratung/Abrechnung"
        strato: "Webhosting"
        strom: "Versorgung"
        tankbeleg: "KFZ"
        tankbelege: "KFZ"
        vodafone: "Telekommunikation"
        wasser: "Versorgung"
        zahn: "Gesundheit"
        zahnarzt: "Gesundheit"
  vacation:
    enabled: true
    log_path: logs/vacation.log
  my_wellness:
    enabled: true
    token: MY_WELLNESS_TOKEN
    user_id: MY_WELLNESS_USER_ID
    facility_id: MY_WELLNESS_FACILITY_ID
    database_path: data/mywellness/mywellness.db
    log_path: logs/my_wellness.log
    desired_courses:
      - Cross-Power
      - Body Workout
      - Functional Training
    days: 2
    schedule:
      - "17:00:00"
      - "20:59:58"
  market:
    enabled: true
    database_path: data/market/market.db
    log_path: logs/market.log
    price_provider: yahoo
    news_provider: fallback
