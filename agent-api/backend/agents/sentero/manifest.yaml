id: sentero
name: sentero-Agent
description: Sentero Assistenz-Placeholder fuer Betreuung, Erinnerungen und sichere Tagesablaeufe.
status: draft
api:
  prefix: /api/sentero
  route_module: backend.agents.sentero.routes
runtime:
  service_object: sentero_service
ui:
  icon: HeartHandshake
  dashboard_route: senteroDashboard
settings:
  edition: sentero
scheduler:
  tasks:
    - name: Sentero Behavioral Intelligence
      description: Bewertet stuendlich den Tagesablauf anhand von Profil, Sensorhistorie und aktuellem Verlauf.
      enabled: true
      schedule_type: cron
      schedule:
        cron: "0 * * * *"
        timezone: "Europe/Berlin"
      target_agent: sentero
      target_action: run
      action_type: execute_action
      action_payload:
        dry_run: false
      default_key: sentero:behavior-hourly
