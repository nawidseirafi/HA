id: vacation
name: Vacation-Agent
description: Anwesenheit simulieren und Home-Assistant-Regeln fuer Abwesenheit vorbereiten.
status: draft
api:
  prefix: /api/vacation
  route_module: backend.agents.vacation.routes
runtime:
  service_object: vacation_service
ui:
  icon: ShieldCheck
  dashboard_route: vacationDashboard
settings:
  mode_entity: input_boolean.vacation_mode
  dry_run_default: true
scheduler:
  tasks:
    - default_key: vacation:status-check:0800
      name: Vacation Statuspruefung
      description: Aktualisiert Vacation Status, Kalendererkennung, Reminder und Historie.
      schedule_type: recurring
      schedule:
        time: "08:00"
      target_action: run
