id: invoices
name: Invoices-Agent
description: Belege hochladen, mit KI analysieren, pruefen und exportieren.
status: active
api:
  prefix: /api/invoices
  route_module: backend.agents.invoices.routes
runtime:
  service_object: invoice_service
ui:
  icon: FileText
  dashboard_route: invoiceDashboard
settings:
  schedule:
    default:
      - "22:00:00"
scheduler:
  tasks:
    - default_key: invoices:run:2200
      name: Invoice Agent Lauf 22:00
      description: Scannt und verarbeitet neue Rechnungen am Abend.
      schedule_type: recurring
      schedule:
        time: "22:00"
      target_action: run
