home_assistant:
  url: "http://192.168.178.159:8123"
  token: HA-TOKEN
  token_env: "HA-TOKEN"

llm:
  provider: "gemini"
  gemini:
    api_key: GEMINI_API_KEY
    model: "gemini-2.5-flash"
  openai:
    api_key: OPENAI_API_KEY
    model: "gpt-4.1-mini"
  claude:
    api_key: CLAUDE_API_KEY
    model: "claude-3-5-sonnet"
  llama:
    base_url: "http://192.168.178.X:11434"
    model: "qwen2.5:3b"

invoice_agent:
  inbox_dir: "./data/invoices/inbox"
  archive_dir: "./data/invoices/archive"
  review_dir: "./data/invoices/review"
  database_path: "./data/invoices/invoices.db"
  email_attachment_dir: "./data/invoices/extracted_email_attachments"
  poll_interval_seconds: 600
  default_category: "Unsortiert"
  confidence_threshold: 0.5
  reprocess_existing: false
  email:
    enabled: true
    host_env: "INVOICE_EMAIL_HOST"
    port: 993
    username_env: "INVOICE_EMAIL_USERNAME"
    password_env: "INVOICE_EMAIL_PASSWORD"
    mailbox: "INBOX"
    search: "ALL"
    mark_seen: false
    max_messages: 50
    attachment_extensions:
      - ".pdf"
  portals:
    enabled: false
    providers:
      - name: "huk24"
        enabled: true
        url: "https://www.huk24.de/meine-huk24/postfach/"
        session_path: "./data/invoices/portal_sessions/huk24.json"
        download_dir: "./data/invoices/portal_downloads/huk24"
        debug_dir: "./data/invoices/portal_debug/huk24"
        headless: true
        wait_seconds: 45
  home_assistant_notifications:
    enabled: true
    only_on_changes: true
    title: "Rechnungs-Agent"
    notification_id: "invoice_agent"

tax_export:
  output_dir: "./data/invoices/tax"
  categories:
    all inkl: "Webhosting"
    all-inkl: "Webhosting"
    apotheke: "Gesundheit"
    auto: "KFZ"
    autoversicherung: "Versicherung"
    congstar: "Telekommunikation"
    elster: "Steuer"
    finanzamt: "Steuer"
    gebäudeversicherung: "Versicherung"
    grundbesitz: "Immobilie"
    hausrat: "Versicherung"
    hotel: "Reisekosten"
    huk24: "Versicherung"
    kfz: "KFZ"
    lkh: "Versicherung"
    restaurant: "Bewirtung"
    rechtschutz: "Versicherung"
    rechtsschutz: "Versicherung"
    sc technology: "Beratung/Abrechnung"
    strato: "Webhosting"
    strom: "Versorgung"
    tankbeleg: "KFZ"
    tankbelege: "KFZ"
    vodafone: "Telekommunikation"
    wasser: "Versorgung"
    zahn: "Gesundheit"
    zahnarzt: "Gesundheit"
