- alias: Wasser erkannt - Handy Notification
  id: wasser_erkannt_handy_notification
  description: Erkennt automatisch alle Feuchtigkeitssensoren und sendet eine Notification ans Handy
  mode: single

  trigger:
    # Echter Auslöser: irgendein Wassersensor ist auf "on"
    - platform: template
      id: wasser
      value_template: >
        {{ states.binary_sensor
          | selectattr('attributes.device_class', 'eq', 'moisture')
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0 }}

    # Manueller Test über Entwicklerwerkzeuge → Ereignisse
    - platform: event
      id: test
      event_type: test_handy_wasser_notification

  condition: []

  action:
    - variables:
        wasser_sensoren_aktiv: >
          {{ states.binary_sensor
            | selectattr('attributes.device_class', 'eq', 'moisture')
            | selectattr('state', 'eq', 'on')
            | map(attribute='attributes.friendly_name')
            | list }}

        nachricht: >
          {% if trigger is defined and trigger.id == 'test' %}
            TEST: Wasser erkannt bei Test-Sensor
          {% elif wasser_sensoren_aktiv | count > 0 %}
            Wasser erkannt bei: {{ wasser_sensoren_aktiv | join(', ') }}
          {% else %}
            TEST: Automation manuell gestartet
          {% endif %}

    - service: notify.mobile_app_system_error_404
      data:
        title: "💧 Wasser erkannt"
        message: "{{ nachricht }}"
