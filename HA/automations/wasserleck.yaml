- alias: Wasser erkannt - Apple TV Notification an alle TVs
  description: Erkennt automatisch alle Feuchtigkeitssensoren und sendet eine Notification an alle Apple TVs
  mode: single

  trigger:
    # Echter Auslöser: irgendein Wassersensor ist auf "on"
    - platform: template
      id: wasser
      value_template: >
        {{ states.binary_sensor
          | selectattr('attributes.device_class', 'eq', 'moisture')
          | selectattr('state', 'eq', 'on')
          | list
          | count > 0 }}

    # Manueller Test über Entwicklerwerkzeuge → Ereignisse
    - platform: event
      id: test
      event_type: test_apple_tv_wasser_notification

  condition: []

  action:
    - variables:
        apple_tvs: >
          {{ states.media_player
            | selectattr('attributes.friendly_name', 'search', 'Apple TV')
            | map(attribute='entity_id')
            | list }}

        wasser_sensoren_aktiv: >
          {{ states.binary_sensor
            | selectattr('attributes.device_class', 'eq', 'moisture')
            | selectattr('state', 'eq', 'on')
            | map(attribute='attributes.friendly_name')
            | list }}

        nachricht: >
          {% if trigger is defined and trigger.id == 'test' %}
            TEST: Wasser erkannt bei Test-Sensor
          {% elif wasser_sensoren_aktiv | count > 0 %}
            Wasser erkannt bei: {{ wasser_sensoren_aktiv | join(', ') }}
          {% else %}
            TEST: Automation manuell gestartet
          {% endif %}

    # Apple TVs / Fernseher einschalten
    - service: media_player.turn_on
      target:
        entity_id: "{{ apple_tvs }}"

    # Zeit geben, bis Apple TV / Fernseher wach ist
    - delay: "00:00:07"

    # Notification senden
    # WICHTIG: notify.apple_tv durch deinen echten Apple-TV-Notify-Service ersetzen
    - service: notify.apple_tv
      data:
        title: "💧 Wasser erkannt"
        message: "{{ nachricht }}"