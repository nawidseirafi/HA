- alias: "📬 Briefkasten - Post angekündigt"
  description: "Setzt Meldung wenn Post da ist (persistent bis manuell zurückgesetzt)"
  trigger:
    - platform: state
      entity_id: binary_sensor.briefkasten_vibration
      from: "off"
      to: "on"
  condition: []
  action:
    # 1. Setze das persistent Input Boolean
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.post_im_briefkasten
    # 2. Sende auch noch eine Notification
    - service: notify.mobile_app_system_error_404
      data:
        title: "📬 Post ist da!"
        message: "Bitte Briefkasten leeren"
        data:
          tag: briefkasten_post
  mode: single

- alias: "📬 Briefkasten - Manuelles Zurücksetzen"
  description: "Setzt den Status zurück wenn manuell bestätigt (nur durch User-Aktion)"
  trigger:
    - platform: state
      entity_id: input_boolean.post_im_briefkasten
      from: "on"
      to: "off"
  condition: []
  action:
    - service: notify.mobile_app_system_error_404
      data:
        message: clear_notification
        data:
          tag: briefkasten_post
  mode: single
