- sensor:
    # Gesamtleistung (positiv = Bezug / negativ = Einspeisung)
    - name: "EcoTracker Leistung"
      unique_id: ecotracker_power
      device_class: power
      state: "{{ state_attr('sensor.ecotracker_api', 'power') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    # Durchschnittsleistung
    - name: "EcoTracker Leistung Durchschnitt"
      unique_id: ecotracker_power_avg
      device_class: power
      state: "{{ state_attr('sensor.ecotracker_api', 'powerAvg') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    # Phasen
    - name: "EcoTracker Phase 1"
      unique_id: ecotracker_power_phase1
      device_class: power
      state: "{{ state_attr('sensor.ecotracker_api', 'powerPhase1') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    - name: "EcoTracker Phase 2"
      unique_id: ecotracker_power_phase2
      device_class: power
      state: "{{ state_attr('sensor.ecotracker_api', 'powerPhase2') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    - name: "EcoTracker Phase 3"
      unique_id: ecotracker_power_phase3
      device_class: power
      state: "{{ state_attr('sensor.ecotracker_api', 'powerPhase3') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    # Netzbezug gesamt (kWh), EcoTracker liefert Wh, HA braucht kWh, daher / 1000
    - name: "EcoTracker Netzbezug"
      unique_id: ecotracker_energy_in
      device_class: energy
      state_class: total_increasing
      state: "{{ (state_attr('sensor.ecotracker_api', 'energyCounterIn') | float(0) / 1000) | round(3) }}"
      unit_of_measurement: "kWh"

    # Einspeisung gesamt (kWh)
    - name: "EcoTracker Einspeisung"
      unique_id: ecotracker_energy_out
      device_class: energy
      state_class: total_increasing
      state: "{{ (state_attr('sensor.ecotracker_api', 'energyCounterOut') | float(0) / 1000) | round(3) }}"
      unit_of_measurement: "kWh"
