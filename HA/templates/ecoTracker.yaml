- sensor:
    # Gesamtleistung (positiv = Bezug / negativ = Einspeisung)
    - name: "House Power Total"
      unique_id: ecotracker_power
      device_class: power
      state_class: measurement
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'power') is not none }}"
      state: "{{ state_attr('sensor.laundry_room_power_meter', 'power') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    # Durchschnittsleistung
    - name: "House Power Average"
      unique_id: ecotracker_power_avg
      device_class: power
      state_class: measurement
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'powerAvg') is not none }}"
      state: "{{ state_attr('sensor.laundry_room_power_meter', 'powerAvg') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    # Phasen
    - name: "House Power Phase 1"
      unique_id: ecotracker_power_phase1
      device_class: power
      state_class: measurement
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'powerPhase1') is not none }}"
      state: "{{ state_attr('sensor.laundry_room_power_meter', 'powerPhase1') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    - name: "House Power Phase 2"
      unique_id: ecotracker_power_phase2
      device_class: power
      state_class: measurement
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'powerPhase2') is not none }}"
      state: "{{ state_attr('sensor.laundry_room_power_meter', 'powerPhase2') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    - name: "House Power Phase 3"
      unique_id: ecotracker_power_phase3
      device_class: power
      state_class: measurement
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'powerPhase3') is not none }}"
      state: "{{ state_attr('sensor.laundry_room_power_meter', 'powerPhase3') | float(0) | round(0) }}"
      unit_of_measurement: "W"

    # Netzbezug gesamt (kWh), EcoTracker liefert Wh, HA braucht kWh, daher / 1000
    - name: "House Grid Consumption"
      unique_id: ecotracker_energy_in
      device_class: energy
      state_class: total_increasing
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'energyCounterIn') is not none }}"
      state: "{{ (state_attr('sensor.laundry_room_power_meter', 'energyCounterIn') | float(0) / 1000) | round(3) }}"
      unit_of_measurement: "kWh"

    # Einspeisung gesamt (kWh)
    - name: "House Grid Feed-in"
      unique_id: ecotracker_energy_out
      device_class: energy
      state_class: total_increasing
      availability: "{{ state_attr('sensor.laundry_room_power_meter', 'energyCounterOut') is not none }}"
      state: "{{ (state_attr('sensor.laundry_room_power_meter', 'energyCounterOut') | float(0) / 1000) | round(3) }}"
      unit_of_measurement: "kWh"