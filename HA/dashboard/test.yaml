title: Übersicht
path: übersicht
icon: mdi:home
cards:
  - type: custom:mushroom-template-card
    entity: input_boolean.post_im_briefkasten
    layout: horizontal
    fill_container: true
    primary: |
      {% if is_state(entity, 'on') %}
        📬 Post ist da!
      {% else %}
        📭 Keine Post
      {% endif %}
    secondary: |
      {% if is_state(entity, 'on') %}
        Bitte Briefkasten leeren
      {% else %}
        Alles ruhig
      {% endif %}
    icon: |
      {% if is_state(entity, 'on') %}
        mdi:mailbox
      {% else %}
        mdi:mailbox-outline
      {% endif %}
    icon_color: |
      {% if is_state(entity, 'on') %}
        red
      {% else %}
        green
      {% endif %}
    tap_action:
      action: more-info
    card_mod:
      style: |
        hui-masonry-view, hui-grid-view {
            max-width: 100% !important;
          }
          .column {
            max-width: 100% !important;
          }
        ha-card {
          {% if is_state('binary_sensor.briefkasten', 'on') %}
            background: linear-gradient(135deg, #ff4d4d, #ff0000);
            color: white;
            animation: pulse 2s infinite;
          {% else %}
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
          {% endif %}
          border-radius: 16px;
        }
        @keyframes pulse {
          0% { transform: scale(1); }
          50% { transform: scale(1.02); }
          100% { transform: scale(1); }
        }
  - type: custom:mushroom-template-card
    entity: sensor.abfall_nachster_termin
    primary: "{{ states('sensor.abfall_nachste_art') }}"
    secondary: >-
      {{ states('sensor.abfall_nachstes_datum') }} · in {{
      states('sensor.abfall_tage_bis_abholung') }} Tagen
    icon: mdi:trash-can
    layout: vertical
    tap_action:
      action: more-info
  - type: horizontal-stack
    cards:
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 🔋 Batterie Status
          - type: custom:auto-entities
            card_param: cards
            card:
              type: grid
              columns: 1
              square: false
            filter:
              include:
                - entity_id: "*battery*"
                  options:
                    type: custom:mushroom-template-card
                    layout: horizontal
                    fill_container: true
                    primary: "{{ state_attr(entity, 'friendly_name') }}"
                    secondary: "Akkustand: {{ states(entity) }} %"
                    icon: |
                      {% set b = states(entity) | int(0) %}
                      {% if b <= 10 %} mdi:battery-alert-variant-outline
                      {% elif b <= 25 %} mdi:battery-20
                      {% elif b <= 50 %} mdi:battery-50
                      {% elif b <= 75 %} mdi:battery-70
                      {% else %} mdi:battery-check
                      {% endif %}
                    icon_color: |
                      {% set b = states(entity) | int(0) %}
                      {% if b <= 15 %} red
                      {% elif b <= 30 %} deep-orange
                      {% elif b <= 60 %} amber
                      {% else %} green
                      {% endif %}
                    tap_action:
                      action: more-info
                - entity_id: "*batterie*"
                  options:
                    type: custom:mushroom-template-card
                    layout: horizontal
                    fill_container: true
                    primary: "{{ state_attr(entity, 'friendly_name') }}"
                    secondary: "Akkustand: {{ states(entity) }} %"
                    icon: |
                      {% set b = states(entity) | int(0) %}
                      {% if b <= 10 %} mdi:battery-alert-variant-outline
                      {% elif b <= 25 %} mdi:battery-20
                      {% elif b <= 50 %} mdi:battery-50
                      {% elif b <= 75 %} mdi:battery-70
                      {% else %} mdi:battery-check
                      {% endif %}
                    icon_color: |
                      {% set b = states(entity) | int(0) %}
                      {% if b <= 15 %} red
                      {% elif b <= 30 %} deep-orange
                      {% elif b <= 60 %} amber
                      {% else %} green
                      {% endif %}
                    tap_action:
                      action: more-info
              exclude:
                - state: unavailable
                - state: unknown
            sort:
              method: state
              numeric: true
              count: 4
          - type: custom:expander-card
            title: Weitere Batterien
            clear: true
            cards:
              - type: custom:auto-entities
                card_param: cards
                card:
                  type: grid
                  columns: 1
                  square: false
                filter:
                  include:
                    - entity_id: "*battery*"
                      options:
                        type: custom:mushroom-template-card
                        layout: horizontal
                        fill_container: true
                        primary: "{{ state_attr(entity, 'friendly_name') }}"
                        secondary: "Akkustand: {{ states(entity) }} %"
                        icon: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 10 %} mdi:battery-alert-variant-outline
                          {% elif b <= 25 %} mdi:battery-20
                          {% elif b <= 50 %} mdi:battery-50
                          {% elif b <= 75 %} mdi:battery-70
                          {% else %} mdi:battery-check
                          {% endif %}
                        icon_color: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 15 %} red
                          {% elif b <= 30 %} deep-orange
                          {% elif b <= 60 %} amber
                          {% else %} green
                          {% endif %}
                        tap_action:
                          action: more-info
                    - entity_id: "*batterie*"
                      options:
                        type: custom:mushroom-template-card
                        layout: horizontal
                        fill_container: true
                        primary: "{{ state_attr(entity, 'friendly_name') }}"
                        secondary: "Akkustand: {{ states(entity) }} %"
                        icon: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 10 %} mdi:battery-alert-variant-outline
                          {% elif b <= 25 %} mdi:battery-20
                          {% elif b <= 50 %} mdi:battery-50
                          {% elif b <= 75 %} mdi:battery-70
                          {% else %} mdi:battery-check
                          {% endif %}
                        icon_color: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 15 %} red
                          {% elif b <= 30 %} deep-orange
                          {% elif b <= 60 %} amber
                          {% else %} green
                          {% endif %}
                        tap_action:
                          action: more-info
                  exclude:
                    - state: unavailable
                    - state: unknown
                sort:
                  method: state
                  numeric: true
                  first: 4
      - type: vertical-stack
        cards:
          - type: custom:mushroom-title-card
            title: 🌤️ Wetter
          - type: custom:mushroom-template-card
            entity: weather.forecast_home
            layout: vertical
            fill_container: true
            primary: "{{ states(entity) | title }}"
            secondary: >
              {{ state_attr(entity, 'temperature') }} °C · {{ state_attr(entity,
              'humidity') }} % Luftfeuchte
            icon: |
              {% set w = states(entity) %}
              {% if w == 'sunny' %} mdi:weather-sunny
              {% elif w == 'partlycloudy' %} mdi:weather-partly-cloudy
              {% elif w == 'cloudy' %} mdi:weather-cloudy
              {% elif w == 'rainy' %} mdi:weather-rainy
              {% elif w == 'pouring' %} mdi:weather-pouring
              {% elif w == 'snowy' %} mdi:weather-snowy
              {% elif w == 'fog' %} mdi:weather-fog
              {% elif w == 'windy' %} mdi:weather-windy
              {% elif w == 'lightning' %} mdi:weather-lightning
              {% else %} mdi:weather-partly-cloudy
              {% endif %}
            icon_color: |
              {% set w = states(entity) %}
              {% if w == 'sunny' %} amber
              {% elif w in ['rainy','pouring','lightning'] %} blue
              {% elif w == 'snowy' %} cyan
              {% else %} grey
              {% endif %}
            tap_action:
              action: more-info
          - type: weather-forecast
            entity: weather.forecast_home
            forecast_type: daily
            show_current: false
            show_forecast: true
badges:
  - type: custom:mushroom-template-badge
    icon: mdi:robot-excited
    content: Roboter Steve
    color: green
