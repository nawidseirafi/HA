title: iPad Home Dashboard
views:
  - title: Übersicht
    path: overview
    icon: mdi:home
    type: sections
    max_columns: 4
    badges: []
    cards: []

    sections:
      - type: grid
        column_span: 4
        cards:
          - type: markdown
            content: |
              # Guten Morgen, {{ user }} 👋
              Alles im Blick. Alles unter Kontrolle.
            card_mod:
              style: |
                ha-card {
                  background: transparent;
                  box-shadow: none;
                  color: white;
                  padding: 8px 4px;
                }

      - type: grid
        column_span: 4
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: >
                  {% set temps = namespace(values=[]) %}
                  {% set hums = namespace(values=[]) %}
                  {% for floor in floors() %}
                    {% for area in floor_areas(floor) %}
                      {% for entity_id in area_entities(area) %}
                        {% set state = states(entity_id) %}
                        {% if state not in ['unknown', 'unavailable', 'none'] %}
                          {% if state_attr(entity_id, 'device_class') == 'temperature' %}
                            {% set val = state | float(none) %}
                            {% if val is not none %}
                              {% set temps.values = temps.values + [val] %}
                            {% endif %}
                          {% endif %}
                          {% if state_attr(entity_id, 'device_class') == 'humidity' %}
                            {% set val = state | float(none) %}
                            {% if val is not none %}
                              {% set hums.values = hums.values + [val] %}
                            {% endif %}
                          {% endif %}
                          {% set h_temp = state_attr(entity_id, 'current_temperature') %}
                          {% if h_temp is not none %}
                            {% set temps.values = temps.values + [h_temp | float] %}
                          {% endif %}
                          {% set h_hum = state_attr(entity_id, 'current_humidity') %}
                          {% if h_hum is not none %}
                            {% set hums.values = hums.values + [h_hum | float] %}
                          {% endif %}
                        {% endif %}
                      {% endfor %}
                    {% endfor %}
                  {% endfor %}
                  {% set avg_temp = ((temps.values | sum) / (temps.values | length)) | round(1) if temps.values | length > 0 else '--' %}
                  {% set avg_hum = ((hums.values | sum) / (hums.values | length)) | round(0) if hums.values | length > 0 else '--' %}
                  {{ avg_temp }} °C · {{ avg_hum }} %
                secondary: Ø Hausklima
                icon: mdi:home-thermometer-outline
                icon_color: green
                fill_container: true

              - type: custom:mushroom-template-card
                primary: >
                  {{ states.light | selectattr('state','eq','on') | list | count }} / {{ states.light | list | count }}
                secondary: Lichter an
                icon: mdi:lightbulb-on
                icon_color: amber
                fill_container: true
                tap_action:
                  action: call-service
                  service: light.turn_off
                  target:
                    entity_id: all

              - type: custom:mushroom-template-card
                primary: >
                  {% set ns = namespace(open=0,total=0) %}
                  {% for s in states.binary_sensor %}
                    {% set dc = state_attr(s.entity_id, 'device_class') %}
                    {% if dc in ['window', 'door', 'opening'] %}
                      {% set ns.total = ns.total + 1 %}
                      {% if is_state(s.entity_id, 'on') %}
                        {% set ns.open = ns.open + 1 %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.open }}/{{ ns.total }}
                secondary: >
                  {% set ns = namespace(open=0) %}
                  {% for s in states.binary_sensor %}
                    {% set dc = state_attr(s.entity_id, 'device_class') %}
                    {% if dc in ['window', 'door', 'opening'] and is_state(s.entity_id, 'on') %}
                      {% set ns.open = ns.open + 1 %}
                    {% endif %}
                  {% endfor %}
                  {% if ns.open == 0 %}
                    Alle geschlossen
                  {% elif ns.open == 1 %}
                    1 Fenster/Tür offen
                  {% else %}
                    {{ ns.open }} Fenster/Türen offen
                  {% endif %}
                icon: mdi:window-open-variant
                icon_color: >
                  {% set ns = namespace(open=0) %}
                  {% for s in states.binary_sensor %}
                    {% set dc = state_attr(s.entity_id, 'device_class') %}
                    {% if dc in ['window', 'door', 'opening'] and is_state(s.entity_id, 'on') %}
                      {% set ns.open = ns.open + 1 %}
                    {% endif %}
                  {% endfor %}
                  {{ 'red' if ns.open > 0 else 'disabled' }}
                fill_container: true

              - type: custom:mushroom-template-card
                entity: input_boolean.post_im_briefkasten
                layout: horizontal
                fill_container: true
                primary: >
                  {% if is_state(entity, 'on') %}
                    📬 Post ist da!
                  {% else %}
                    📭 Keine Post
                  {% endif %}
                secondary: >
                  {% if is_state(entity, 'on') %}
                    Bitte Briefkasten leeren
                  {% else %}
                    Alles ruhig
                  {% endif %}
                icon: >
                  {% if is_state(entity, 'on') %}
                    mdi:mailbox
                  {% else %}
                    mdi:mailbox-outline
                  {% endif %}
                icon_color: >
                  {% if is_state(entity, 'on') %}
                    red
                  {% else %}
                    green
                  {% endif %}
                tap_action:
                  action: more-info

      - type: grid
        column_span: 2
        cards:
          - type: weather-forecast
            entity: weather.forecast_home
            name: Wetter
            forecast_type: daily
            show_forecast: true

      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Favoriten
            show_header_toggle: false
            entities:
              - entity: light.wohnzimmer # TODO: an echte Entity anpassen
                name: Wohnzimmer Licht
              - entity: light.kueche # TODO: an echte Entity anpassen
                name: Küche Licht
              - entity: light.terrasse # TODO: an echte Entity anpassen
                name: Terrassenlicht
              - entity: media_player.tv # TODO: an echte Entity anpassen
                name: TV
              - entity: switch.kaffeemaschine # TODO: an echte Entity anpassen
                name: Kaffeemaschine
              - entity: vacuum.saugroboter # TODO: an echte Entity anpassen
                name: Saugroboter

      - type: grid
        column_span: 1
        cards:
          - type: custom:mini-graph-card
            name: Energieverbrauch
            icon: mdi:flash
            entities:
              - entity: sensor.energy_today # TODO: an echte Entity anpassen
                name: Heute
            hours_to_show: 24
            points_per_hour: 1
            show:
              graph: bar
              icon: true
              name: true
              state: true

      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Räume
            entities:
              - entity: sensor.wohnzimmer_temperatur # TODO: an echte Entity anpassen
                name: Wohnzimmer
              - entity: sensor.kueche_temperatur # TODO: an echte Entity anpassen
                name: Küche
              - entity: sensor.schlafzimmer_temperatur # TODO: an echte Entity anpassen
                name: Schlafzimmer
              - entity: sensor.bad_temperatur # TODO: an echte Entity anpassen
                name: Badezimmer

      - type: grid
        column_span: 1
        cards:
          - type: picture-glance
            title: Eingang
            camera_image: camera.eingang # TODO: an echte Kamera-Entity anpassen
            camera_view: live
            entities:
              - binary_sensor.haustuer # TODO: an echte Entity anpassen
              - light.eingang # TODO: an echte Entity anpassen
          - type: picture-glance
            title: Garten
            camera_image: camera.garten # TODO: an echte Kamera-Entity anpassen
            camera_view: live
            entities:
              - light.garten # TODO: an echte Entity anpassen
              - binary_sensor.garten_bewegung # TODO: an echte Entity anpassen

      - type: grid
        column_span: 1
        cards:
          - type: calendar
            title: Nächste Termine
            entities:
              - calendar.nawid
              - calendar.familie

      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Aktive Automationen
            show_header_toggle: false
            entities:
              - entity: automation.guten_morgen # TODO: an echte Automation anpassen
              - entity: automation.gute_nacht # TODO: an echte Automation anpassen
              - entity: automation.bei_anwesenheit # TODO: an echte Automation anpassen
              - entity: automation.bei_abwesenheit # TODO: an echte Automation anpassen
              - entity: input_boolean.vacation_mode
                name: Urlaubsmodus

      - type: grid
        column_span: 1
        cards:
          - type: entities
            title: Benachrichtigungen
            entities:
              - entity: binary_sensor.haustuer # TODO: an echte Entity anpassen
                name: Haustür
              - entity: input_boolean.post_im_briefkasten
                name: Briefkasten
              - entity: update.home_assistant_core_update
                name: Home Assistant Update

      - type: grid
        column_span: 2
        cards:
          - type: logbook
            title: Verlauf
            hours_to_show: 4
            entities:
              - light.wohnzimmer # TODO: an echte Entity anpassen
              - light.kueche # TODO: an echte Entity anpassen
              - input_boolean.post_im_briefkasten
              - vacuum.saugroboter # TODO: an echte Entity anpassen
              - switch.kaffeemaschine # TODO: an echte Entity anpassen

      - type: grid
        column_span: 1
        cards:
          - type: media-control
            entity: media_player.spotify # TODO: an echte Entity anpassen

      - type: grid
        column_span: 1
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.abfall_naechster_termin
            primary: >
              {% set ns = namespace(result='') %}
              {% set next = state_attr('sensor.abfall_naechster_termin', 'next') %}
              {% set data = state_attr('sensor.abfall_naechster_termin', 'next_by_type') or {} %}
              {% if next %}
                {% set next_date = next.date %}
                {% for typ, item in data.items() %}
                  {% if item.date == next_date %}
                    {% if 'Bio' in typ %}
                      {% set ns.result = ns.result ~ '🍃 Bio ' %}
                    {% elif 'Papier' in typ or 'Altpapier' in typ or 'Blaue' in typ %}
                      {% set ns.result = ns.result ~ '▣ Papier ' %}
                    {% elif 'Gelb' in typ or 'Leicht' in typ %}
                      {% set ns.result = ns.result ~ '♻ Gelb ' %}
                    {% elif 'Rest' in typ %}
                      {% set ns.result = ns.result ~ '🗑 Rest ' %}
                    {% else %}
                      {% set ns.result = ns.result ~ typ ~ '  ' %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
              {% endif %}
              {{ ns.result if ns.result else 'Keine Termine' }}
            secondary: >
              {% set next = state_attr('sensor.abfall_naechster_termin', 'next') %}
              {% if next %}
                {% set days = next.days_until | int %}
                {% if days == 0 %}
                  {{ next.date_de }} · Heute
                {% elif days == 1 %}
                  {{ next.date_de }} · Morgen
                {% elif days == 2 %}
                  {{ next.date_de }} · Übermorgen
                {% else %}
                  {{ next.date_de }} · in {{ days }} Tagen
                {% endif %}
              {% else %}
                Kein Termin
              {% endif %}
            icon: mdi:trash-can-outline
            icon_color: green

      - type: grid
        column_span: 2
        cards:
          - type: custom:expander-card
            clear: true
            title-card:
              type: custom:auto-entities
              card_param: cards
              card:
                type: grid
                columns: 1
                square: false
              filter:
                include:
                  - domain: sensor
                    attributes:
                      device_class: battery
                    options:
                      type: custom:mushroom-template-card
                      layout: horizontal
                      fill_container: true
                      primary: "{{ state_attr(entity, 'friendly_name') }}"
                      secondary: "Akkustand: {{ states(entity) }} %"
                      icon: |
                        {% set b = states(entity) | int(0) %}
                        {% if b <= 10 %} mdi:battery-alert-variant-outline
                        {% elif b <= 25 %} mdi:battery-20
                        {% elif b <= 50 %} mdi:battery-50
                        {% elif b <= 75 %} mdi:battery-70
                        {% else %} mdi:battery-check
                        {% endif %}
                      icon_color: |
                        {% set b = states(entity) | int(0) %}
                        {% if b <= 15 %} red
                        {% elif b <= 30 %} deep-orange
                        {% elif b <= 60 %} amber
                        {% else %} green
                        {% endif %}
                exclude:
                  - state: unavailable
                  - state: unknown
              sort:
                method: state
                numeric: true
                reverse: false
                count: 1

            cards:
              - type: custom:auto-entities
                card_param: cards
                card:
                  type: grid
                  columns: 1
                  square: false
                filter:
                  include:
                    - domain: sensor
                      attributes:
                        device_class: battery
                      options:
                        type: custom:mushroom-template-card
                        layout: horizontal
                        fill_container: true
                        primary: "{{ state_attr(entity, 'friendly_name') }}"
                        secondary: "Akkustand: {{ states(entity) }} %"
                        icon: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 10 %} mdi:battery-alert-variant-outline
                          {% elif b <= 25 %} mdi:battery-20
                          {% elif b <= 50 %} mdi:battery-50
                          {% elif b <= 75 %} mdi:battery-70
                          {% else %} mdi:battery-check
                          {% endif %}
                        icon_color: |
                          {% set b = states(entity) | int(0) %}
                          {% if b <= 15 %} red
                          {% elif b <= 30 %} deep-orange
                          {% elif b <= 60 %} amber
                          {% else %} green
                          {% endif %}
                        tap_action:
                          action: more-info
                  exclude:
                    - state: unavailable
                    - state: unknown
                sort:
                  method: state
                  numeric: true
                  reverse: false

  - title: Räume
    path: rooms
    icon: mdi:floor-plan
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: Wohnzimmer
            entities:
              - light.wohnzimmer # TODO: an echte Entity anpassen
              - media_player.tv # TODO: an echte Entity anpassen
              - sensor.wohnzimmer_temperatur # TODO: an echte Entity anpassen
              - cover.wohnzimmer # TODO: an echte Entity anpassen

      - type: grid
        cards:
          - type: entities
            title: Küche
            entities:
              - light.kueche # TODO: an echte Entity anpassen
              - switch.kaffeemaschine # TODO: an echte Entity anpassen
              - sensor.kueche_temperatur # TODO: an echte Entity anpassen

      - type: grid
        cards:
          - type: entities
            title: Schlafzimmer
            entities:
              - light.schlafzimmer # TODO: an echte Entity anpassen
              - cover.schlafzimmer # TODO: an echte Entity anpassen
              - sensor.schlafzimmer_temperatur # TODO: an echte Entity anpassen

  - title: Agenten
    path: agents
    icon: mdi:robot
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: entities
            title: AI Agenten
            show_header_toggle: false
            entities:
              - entity: input_boolean.vacation_mode
                name: Urlaubsmodus manuell
              - entity: input_boolean.ai_agent_enabled # TODO: an echte Entity anpassen
                name: AI Agent aktiv
              - entity: sensor.ai_agent_status # TODO: an echte Entity anpassen
                name: Agent Status
              - entity: sensor.ai_agent_last_action # TODO: an echte Entity anpassen
                name: Letzte Aktion
              - entity: sensor.ai_agent_provider # TODO: an echte Entity anpassen
                name: LLM Provider

      - type: grid
        cards:
          - type: logbook
            title: Agent Verlauf
            hours_to_show: 24
            entities:
              - input_boolean.vacation_mode
              - sensor.ai_agent_status # TODO: an echte Entity anpassen
              - sensor.ai_agent_last_action # TODO: an echte Entity anpassen
