- id: '1781766856309'
  alias: "\U0001F6A8 Tasche - Bewegung erkannt"
  description: Benachrichtigt, wenn der Diebstahlsensor an der Tasche bewegt oder
    geöffnet wird
  triggers:
  - id: orientation
    entity_id: sensor.diebstahlsensor_orientation
    trigger: state
  - id: posture
    entity_id: sensor.diebstahlsensor_device_posture
    trigger: state
  - id: contact
    entity_id: binary_sensor.diebstahlsensor_contact
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ trigger.from_state is not none\n  and trigger.to_state is
      not none\n  and trigger.from_state.state not in ['unknown', 'unavailable']\n
      \ and trigger.to_state.state not in ['unknown', 'unavailable']\n  and trigger.from_state.state
      != trigger.to_state.state }}\n"
  actions:
  - data:
      title: "\U0001F6A8 Tasche bewegt"
      message: "{% if trigger.id == 'contact' %}\n  Der Diebstahlsensor wurde geöffnet
        oder getrennt.\n{% elif trigger.id == 'orientation' %}\n  Die Tasche wurde
        bewegt. Neue Ausrichtung: {{ trigger.to_state.state }}.\n{% elif trigger.id
        == 'posture' %}\n  Die Tasche wurde bewegt. Neue Lage: {{ trigger.to_state.state
        }}.\n{% else %}\n  Der Diebstahlsensor hat eine Bewegung erkannt.\n{% endif
        %}\n"
    action: notify.mobile_app_system_error_404
  - delay: 00:02:00
  mode: single
