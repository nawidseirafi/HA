- id: '1781687332588'
  alias: "\U0001F4EC Briefkasten - Post angekündigt"
  description: Setzt Meldung wenn Post da ist (persistent bis manuell zurückgesetzt)
  triggers:
  - entity_id: binary_sensor.briefkasten_vibration
    from: 'off'
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - target:
      entity_id: input_boolean.post_im_briefkasten
    action: input_boolean.turn_on
  - data:
      title: "\U0001F4EC Post ist da!"
      message: Bitte Briefkasten leeren
    action: notify.mobile_app_system_error_404
  mode: single
